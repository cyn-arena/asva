name: TEMP - GITHUB_TOKEN test (delete after)

# Temporary. Tests whether ASVA's fix jobs could use GITHUB_TOKEN instead of GHPAT_ASVA_GITOPS:
# push a new branch, open a PR, comment and mark it as a draft, and see whether the PR starts the
# PyGoat PR checks. Runs once when this file is pushed to feat/testing. Delete this file, the test
# branch and the test PR afterwards.
# Run 2: pygoat-validate.yml and pygoat-baseline.yml skip PRs from github-actions[bot]. Does that turn
# their "startup failure" into "skipped"?

on:
  push:
    branches:
      - feat/testing
    paths:
      - '.github/workflows/token-test.yml'

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  token-test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_BRANCH: test/github-token-${{ github.run_id }}
    steps:
      - name: Checkout with GITHUB_TOKEN
        uses: actions/checkout@v4

      - name: 1. Push a new branch with GITHUB_TOKEN
        id: push
        continue-on-error: true
        run: |
          git config user.name "asva-token-test"
          git config user.email "asva-token-test@users.noreply.github.com"
          git switch -c "$TEST_BRANCH"
          echo "Temporary file from the GITHUB_TOKEN test. Deleted with this branch." > target-apps/PyGoat/asva-token-test.txt
          git add target-apps/PyGoat/asva-token-test.txt
          git commit -m "test: GITHUB_TOKEN push (temporary)"
          git push -u origin "$TEST_BRANCH"

      - name: 2. Open a PR with GITHUB_TOKEN
        id: pr
        if: steps.push.outcome == 'success'
        continue-on-error: true
        run: |
          url=$(gh pr create --base feat/testing --head "$TEST_BRANCH" \
            --title "TEMP: GITHUB_TOKEN test, do not merge" \
            --body "Opened by a temporary workflow to test whether ASVA can use GITHUB_TOKEN instead of GHPAT_ASVA_GITOPS. It will be closed and deleted.")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      - name: 3. Comment and mark as draft with GITHUB_TOKEN
        id: edit
        if: steps.pr.outcome == 'success'
        continue-on-error: true
        run: |
          gh pr comment "${{ steps.pr.outputs.url }}" --body "Comment posted with GITHUB_TOKEN."
          gh pr ready "${{ steps.pr.outputs.url }}" --undo

      - name: 4. Did the PR start the PyGoat PR checks?
        id: checks
        if: steps.pr.outcome == 'success'
        continue-on-error: true
        run: |
          sleep 90
          gh run list --branch "$TEST_BRANCH" --json name,event,status,conclusion \
            --jq '.[] | "\(.event) | \(.name) | \(.status) \(.conclusion)"' > runs.txt
          echo "Runs started on $TEST_BRANCH:"; cat runs.txt
          echo "count=$(grep -c . runs.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Results
        if: always()
        run: |
          {
            echo "## GITHUB_TOKEN test"
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| 1. Push a new branch | ${{ steps.push.outcome }} |"
            echo "| 2. Open a PR | ${{ steps.pr.outcome }} ${{ steps.pr.outputs.url }} |"
            echo "| 3. Comment and mark as draft | ${{ steps.edit.outcome }} |"
            echo "| 4. Workflows started by the PR | ${{ steps.checks.outputs.count }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
