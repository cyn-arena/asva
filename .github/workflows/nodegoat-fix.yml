name: NodeGoat - Normalise, triage and generate candidates

# Four jobs, so the fix batches run at the same time instead of one after another:
#   prepare     normalise and triage once, then list the fix batches
#   fix         one job per batch, in parallel: the agent fixes, tests and opens that batch's PRs
#   candidates  combine the fix jobs' results into the one nodegoat-fix-output the later jobs read
#   memory      add each fix job's fix history to the saved memory database, then save it once

on:
  workflow_call:
    inputs:
        use_artifacts:
          description: "Use artifacts from the current workflow run"
          type: boolean
          default: false
          required: false
        scan_run_id:
          description: "Optional workflow run ID. Leave blank to use the latest successful scan"
          type: string
          required: false
        source_branch:
          description: "Scanned branch for current-run artifacts; fix PRs return to this branch"
          type: string
          required: false
        source_sha:
          description: "Exact scanned commit for current-run artifacts"
          type: string
          required: false
    secrets:
      OLLAMA_API_KEY:
        required: false
      OLLAMA_API_KEY_TEST:
        required: false
      AZURE_CREDENTIALS:
        required: true
      NVD_API_KEY:
        required: false
      CONTEXT7_API_KEY:
        required: false
      SNYK_TOKEN:
        required: false
      SNYK_ORG:
        required: false
    outputs:
      prs:
        description: >-
          JSON array of PRs opened this run ([{batch_id, branch, pr_url, status}, ...]),
          filtered to status == "pr_opened" -- consumed by nodegoat-orchestrator.yml's
          pr-check job as its matrix.
        value: ${{ jobs.candidates.outputs.prs }}

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write
  packages: read   # to pull the RAG image

jobs:
  prepare:
    name: Normalise and triage findings
    runs-on: ubuntu-latest

    outputs:
      batches: ${{ steps.batches.outputs.batches }}
      has_container: ${{ steps.batches.outputs.has_container }}
      sha: ${{ steps.source.outputs.sha }}
      # The scan run the fix jobs resolve the same source from.
      scan_run_id: ${{ inputs.use_artifacts && github.run_id || inputs.scan_run_id || steps.latest_scan.outputs.run_id }}
      normalise: ${{ steps.normalise.outcome }}
      triage: ${{ steps.triage.outcome }}

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Initialize remediation results path
        shell: bash
        run: |
          # Runner paths are available in steps, not in job-level env expressions.
          echo "ASVA_RESULTS_DIR=$RUNNER_TEMP/nodegoat-fix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Debug inputs
        run: |
          echo "event = ${{ github.event_name }}"
          echo "inputs.scan_run_id = '${{ inputs.scan_run_id }}'"
          echo "github.event.inputs.scan_run_id = '${{ github.event.inputs.scan_run_id }}'"
          echo "inputs.use_artifacts = '${{ inputs.use_artifacts }}'"

      # ---------- For run with scan + fix ----------
      - name: Download scan artifacts from current run
        # runs only when use_artifact: true
        if: ${{ inputs.use_artifacts }}
        uses: actions/download-artifact@v4
        with:
          name: nodegoat-scan-results
          path: ${{ env.ASVA_RESULTS_DIR }}/scan

      # ---------- For standalone fix (Download artifact from scan) ----------
      - name: Find latest successful scan
        if: ${{ !inputs.use_artifacts && inputs.scan_run_id == '' }}
        id: latest_scan
        run: |
          RUN_ID=$(gh run list --workflow=nodegoat-orchestrator.yml --branch "$CURRENT_BRANCH" --status=success --limit=1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful NodeGoat pipeline run found for this branch; provide scan_run_id."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_BRANCH: ${{ github.ref_name }}

      - name: Download latest scan artifacts
        # runs only when use_artifacts: false
        if: ${{ !inputs.use_artifacts && inputs.scan_run_id == ''}}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.latest_scan.outputs.run_id }}
          name: nodegoat-scan-results
          path: ${{ env.ASVA_RESULTS_DIR }}/scan

      # ---------- For standalone fix (Download artifact from specified run ID) ----------
      - name: Download specified scan artifacts
        # runs only when use_artifacts: false and scan_run_id is provided
        if: ${{ !inputs.use_artifacts && inputs.scan_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.scan_run_id }}
          name: nodegoat-scan-results
          path: ${{ env.ASVA_RESULTS_DIR }}/scan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve scanned branch and commit
        id: source
        env:
          USE_CURRENT_ARTIFACTS: ${{ inputs.use_artifacts }}
          SCAN_RUN_ID: ${{ inputs.use_artifacts && github.run_id || inputs.scan_run_id || steps.latest_scan.outputs.run_id }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CURRENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          python scripts/resolve-scan-source.py \
            --use-current-artifacts "$USE_CURRENT_ARTIFACTS" \
            --scan-run-id "$SCAN_RUN_ID" \
            --source-branch "$SOURCE_BRANCH" --source-sha "$SOURCE_SHA" \
            --ref-type "$CURRENT_REF_TYPE" --repository "$GITHUB_REPOSITORY"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Prepare generated results directories
        run: |
          mkdir -p "$ASVA_RESULTS_DIR/findings" "$ASVA_RESULTS_DIR/fix_batches"

      - name: Normalise scan findings
        id: normalise
        run: |
          python normaliser/normaliser.py \
            --inputs "$ASVA_RESULTS_DIR/scan/sast.sarif.json" \
                     "$ASVA_RESULTS_DIR/scan/image.sarif.json" \
                     "$ASVA_RESULTS_DIR/scan/sca.sarif.json" \
            --output-dir "$ASVA_RESULTS_DIR/findings"

      - name: Triage findings and create fix batches
        id: triage
        run: |
          python triage/triage.py \
            --input "$ASVA_RESULTS_DIR/findings/ranked_unified_findings.json" \
            --output "$ASVA_RESULTS_DIR/findings/ranked_findings.json" \
            --batch-dir "$ASVA_RESULTS_DIR/fix_batches" \
            --repo-name asva-nodegoat \
            --commit-sha "$ASVA_SCANNED_SHA"

      - name: List the fix batches, one fix job each
        id: batches
        shell: python
        run: |
          import json, os, pathlib
          rows = []
          for path in sorted(pathlib.Path(os.environ["ASVA_RESULTS_DIR"], "fix_batches").glob("*.json")):
              batch = json.loads(path.read_text(encoding="utf-8"))
              rows.append({"file": path.name, "batch_id": batch["batch_id"], "batch_type": batch["batch_type"]})
          print(f"{len(rows)} fix batch(es): " + ", ".join(r["batch_id"] for r in rows))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("batches=" + json.dumps(rows, separators=(",", ":")) + "\n")
              out.write("has_container=" + str(any(r["batch_type"] == "container" for r in rows)).lower() + "\n")

      - name: Save findings and fix batches for the fix jobs
        if: ${{ !cancelled() && steps.normalise.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: fixprep-nodegoat
          retention-days: 14
          overwrite: true
          path: |
            ${{ env.ASVA_RESULTS_DIR }}/findings/*.json
            ${{ env.ASVA_RESULTS_DIR }}/fix_batches/*.json

  fix:
    name: Findings processing and candidate generation (${{ matrix.batch.batch_id }})
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.batches != '[]' && needs.prepare.outputs.batches != ''
    runs-on: ubuntu-latest
    strategy:
      # A batch that opens no PR (a held-back container batch) must not stop the others.
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.prepare.outputs.batches) }}

    env:
      GH_TOKEN: ${{ github.token }}
      ASVA_SOURCE_DIR: ${{ github.workspace }}/asva-fix-source
      ASVA_FIX_PATH_PREFIX: target-apps/NodeGoat
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY_TEST || secrets.OLLAMA_API_KEY }}
      OLLAMA_HOST: ${{ vars.ASVA_OLLAMA_HOST }}
      # Same default as PyGoat; NodeGoat uses a separate override.
      OLLAMA_MODEL: ${{ vars.ASVA_NODEGOAT_OLLAMA_MODEL || 'deepseek-v4.1-flash' }}
      # Maximum output tokens per AI request.
      ASVA_LLM_NUM_PREDICT: '65535'
      # Context window the model server uses; the agent warns when a prompt may not fit (ITP2 3.6).
      OLLAMA_NUM_CTX: '1000000'
      # Test fixes before there is a PR: try held-back upgrades, retry code fixes (agent/test_first.py).
      ASVA_TEST_FIRST: '1'
      # Try to fix holes this app's security tests show, as separate commits (agent/test_first.py).
      ASVA_MISUSE_FIX: '1'
      # Scan a code fix before its PR, for what it adds (agent/code_scan.py).
      ASVA_SCAN_BEFORE_PR: '1'
      # How this app is checked (agent/app_check.py). Only one server process, so one smoke run.
      ASVA_APP_COMPOSE_FILES: docker-compose.yml docker-compose.pr-check.yml
      ASVA_APP_READY_URL: http://127.0.0.1:4000/login/
      ASVA_APP_SMOKE_COMMAND: python -m pytest -m smoke tests/e2e/browser/test_smoke.py -vv --tb=short -p no:cacheprovider
      ASVA_APP_SMOKE_RUNS: '1'
      ASVA_APP_SECURITY_COMMAND: python -m pytest -m api tests/e2e/api/test_misuse_cases.py -k "{tests}" -vv --tb=short -p no:cacheprovider
      ASVA_APP_SECURITY_TESTS_FILE: tests/e2e/api/test_misuse_cases.py
      # Where the RAG keeps its database between runs (scripts/rag-container.sh). The fix jobs
      # each save it, and the last one wins: it is only a cache of public lookups.
      # Azure Blob storage account and container, set as repository variables.
      ASVA_AZURE_STORAGE_ACCOUNT: ${{ vars.ASVA_AZURE_STORAGE_ACCOUNT }}
      ASVA_AZURE_STORAGE_CONTAINER: ${{ vars.ASVA_AZURE_STORAGE_CONTAINER }}
      ASVA_RAG_STORAGE_ACCOUNT: ${{ vars.ASVA_AZURE_STORAGE_ACCOUNT }}
      ASVA_RAG_STORAGE_CONTAINER: ${{ vars.ASVA_AZURE_STORAGE_CONTAINER }}
      ASVA_RAG_BLOB: asva-rag/rag.db
      # Set this repository variable to 'llm' to restore whole-file AI dependency fixes.
      ASVA_SCA_FIX_MODE: ${{ vars.ASVA_SCA_FIX_MODE || 'npm' }}
      # The npm this app's lockfile is generated with (agent/npm_remediation.py).
      ASVA_NPM_VERSION: '8.19.4'
      BATCH_FILE: ${{ matrix.batch.file }}

    steps:
      - name: Initialize remediation results path
        shell: bash
        run: |
          # Runner paths are available in steps, not in job-level env expressions.
          # Keep generated evidence outside the checkout so GitOps can switch branches.
          echo "ASVA_RESULTS_DIR=$RUNNER_TEMP/nodegoat-fix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve scanned branch and commit
        id: source
        env:
          USE_CURRENT_ARTIFACTS: ${{ inputs.use_artifacts }}
          SCAN_RUN_ID: ${{ needs.prepare.outputs.scan_run_id }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CURRENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          python scripts/resolve-scan-source.py \
            --use-current-artifacts "$USE_CURRENT_ARTIFACTS" \
            --scan-run-id "$SCAN_RUN_ID" \
            --source-branch "$SOURCE_BRANCH" --source-sha "$SOURCE_SHA" \
            --ref-type "$CURRENT_REF_TYPE" --repository "$GITHUB_REPOSITORY"

      - name: Checkout exact scanned application source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: asva-fix-source
          fetch-depth: 0
          # Git push uses checkout's persisted credentials, so the fix branches are pushed with
          # GITHUB_TOKEN. gh opens the PRs with the job's GH_TOKEN, also GITHUB_TOKEN.
          token: ${{ github.token }}

      - name: Set up Node.js for npm dependency remediation
        if: env.ASVA_SCA_FIX_MODE == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install pinned npm for lockfile version 2
        if: env.ASVA_SCA_FIX_MODE == 'npm'
        run: npm install --global "npm@$ASVA_NPM_VERSION" --ignore-scripts --no-audit --no-fund

      - name: Validate dependency remediation mode
        run: |
          case "$ASVA_SCA_FIX_MODE" in
            npm|llm) ;;
            *) echo "::error::ASVA_SCA_FIX_MODE must be npm or llm"; exit 1 ;;
          esac

      - name: Install gitleaks
        run: |
          INSTALL_DIR="$HOME/.local/bin" bash scripts/install-gitleaks.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Configure git identity
        working-directory: ${{ env.ASVA_SOURCE_DIR }}
        run: |
          git config user.name  "asva-bot"
          git config user.email "asva-bot@users.noreply.github.com"

      - name: Verify fix source before paid AI calls
        run: |
          if ! git -C "$ASVA_SOURCE_DIR" diff --quiet || ! git -C "$ASVA_SOURCE_DIR" diff --cached --quiet; then
            echo "::error::Scanned source checkout contains tracked changes."
            exit 1
          fi
          python -c 'import os; from gitops.git_gh_ops import prepare_fix_source; prepare_fix_source(os.environ["GITHUB_BASE_BRANCH"], os.environ["ASVA_SOURCE_DIR"])'

      - name: Download findings and fix batches
        uses: actions/download-artifact@v4
        with:
          name: fixprep-nodegoat
          path: ${{ env.ASVA_RESULTS_DIR }}/prep

      - name: Keep only this job's fix batch
        run: |
          mkdir -p "$ASVA_RESULTS_DIR/findings" "$ASVA_RESULTS_DIR/fix_batches"
          cp "$ASVA_RESULTS_DIR"/prep/findings/*.json "$ASVA_RESULTS_DIR/findings/"
          cp "$ASVA_RESULTS_DIR/prep/fix_batches/$BATCH_FILE" "$ASVA_RESULTS_DIR/fix_batches/"

      # ---------- Authenticate to Azure ----------
      - name: Authenticate to Azure
        id: azure_login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------- Memory injection ----------
      # Read only here: this job's new rows are saved by the memory job, with the other fix jobs'.
      - name: Download SQLite memory database
        shell: bash
        run: |
          mkdir -p memory

          if az storage blob exists \
            --account-name "$ASVA_AZURE_STORAGE_ACCOUNT" \
            --container-name "$ASVA_AZURE_STORAGE_CONTAINER" \
            --name asva-memory/asva_memory.db \
            --auth-mode login \
            --query exists -o tsv | grep -qx true; then

            az storage blob download \
              --account-name "$ASVA_AZURE_STORAGE_ACCOUNT" \
              --container-name "$ASVA_AZURE_STORAGE_CONTAINER" \
              --name asva-memory/asva_memory.db \
              --file memory/asva_memory.db \
              --auth-mode login \
              --overwrite \
              -o none --no-progress

          else
            echo "No existing memory database found; the agent must initialize it."
          fi

      # Reviewer decisions written by the dashboard. Kept out of memory/ so the
      # sample memory/decisions.json in the repo is never used by accident.
      - name: Download reviewer decisions
        shell: bash
        run: |
          mkdir -p decisions
          if az storage blob exists \
            --account-name "$ASVA_AZURE_STORAGE_ACCOUNT" \
            --container-name "$ASVA_AZURE_STORAGE_CONTAINER" \
            --name nodegoat/memory/decisions.json \
            --auth-mode login \
            --query exists -o tsv | grep -qx true; then

            az storage blob download \
              --account-name "$ASVA_AZURE_STORAGE_ACCOUNT" \
              --container-name "$ASVA_AZURE_STORAGE_CONTAINER" \
              --name nodegoat/memory/decisions.json \
              --file decisions/decisions.json \
              --auth-mode login \
              --overwrite \
              -o none --no-progress
          else
            echo "No decisions.json in Azure; running without reviewer decisions."
          fi
          echo "ASVA_DECISIONS_PATH=$GITHUB_WORKSPACE/decisions/decisions.json" >> "$GITHUB_ENV"

      - name: Validate reviewer decisions format
        continue-on-error: true
        run: python -m memory.decisions_loader

      - name: Install what the app check needs before a PR
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          INSTALL_DIR="$HOME/.local/bin" bash scripts/install-snyk.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ---------- RAG ----------
      - name: Start the RAG
        env:
          GHCR_TOKEN: ${{ github.token }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: bash scripts/rag-container.sh start

      # The agent exits nonzero when its batch opens no PR, which is normal for one batch (a
      # held-back container batch). The candidates job judges the run as a whole.
      - name: Generate fix candidates and open PRs
        id: agent
        continue-on-error: true
        env:
          # One of the security tests the fixes are tested with before the PR rescans with Snyk.
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ secrets.SNYK_ORG }}
          SNYK_CFG_ORG: ${{ secrets.SNYK_ORG }}
        run: |
          # Generated evidence must not modify the separate scanned-source checkout.
          if ! git -C "$ASVA_SOURCE_DIR" diff --quiet || ! git -C "$ASVA_SOURCE_DIR" diff --cached --quiet; then
            echo "::error::Tracked source was modified before remediation; cannot safely switch fix branches."
            exit 1
          fi
          python -u agent/agent_loop.py \
            --batch-dir "$ASVA_RESULTS_DIR/fix_batches" \
            --repo-dir "$ASVA_SOURCE_DIR" \
            --output-json "$ASVA_RESULTS_DIR/prs.json" \
            --import-map-dir "$ASVA_RESULTS_DIR/import_maps" \
            --findings-json "$ASVA_RESULTS_DIR/findings/ranked_unified_findings.json"

      # Before the RAG stops, so it can say where fixes are published. Never fails the job.
      # Only the container batch's job: without one, the candidates job posts the report.
      - name: Update the container report issue
        if: ${{ !cancelled() && matrix.batch.batch_type == 'container' }}
        continue-on-error: true
        run: |
          python -m gitops.post_container_report \
            --findings "$ASVA_RESULTS_DIR/findings/ranked_unified_findings.json" \
            --batch-dir "$ASVA_RESULTS_DIR/fix_batches" \
            --prs-json "$ASVA_RESULTS_DIR/prs.json" \
            --commit-sha "$ASVA_SCANNED_SHA" \
            --repo-name asva-nodegoat \
            --repo-dir "$ASVA_SOURCE_DIR" \
            --execute

      - name: Stop the RAG and save its database
        if: always()
        run: bash scripts/rag-container.sh stop

      - name: Collect fix diffs, PR metadata and per-stage outcomes
        id: evidence
        if: always()
        env:
          NORMALISE_RESULT: ${{ needs.prepare.outputs.normalise }}
          TRIAGE_RESULT: ${{ needs.prepare.outputs.triage }}
          AGENT_RESULT: ${{ steps.agent.outcome }}
        run: |
          python scripts/dashboard_evidence.py fixes --app nodegoat \
            --results-dir "$ASVA_RESULTS_DIR" --source-dir "$ASVA_SOURCE_DIR" \
            --scanned-sha "${ASVA_SCANNED_SHA:-$GITHUB_SHA}" --agent-result "$AGENT_RESULT"

      # The agent exits nonzero whenever zero PRs opened -- so the all-batches-failed run,
      # the exact case this step exists for, marks the agent step as failed. Gate on "the
      # agent ran at all" (success OR failure), not on success, or the loudest failure
      # would be the one that files no issue.
      - name: File an issue for any batch that failed before commit
        if: ${{ !cancelled() && steps.agent.outcome != 'skipped' }}
        run: |
          python -m gitops.post_fix_failure_issue \
            --prs-json "$ASVA_RESULTS_DIR/prs.json" \
            --batch-dir "$ASVA_RESULTS_DIR/fix_batches" \
            --repo-dir "$ASVA_SOURCE_DIR" \
            --execute

      - name: Save this batch's results for the candidates job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixpart-nodegoat-${{ matrix.batch.batch_id }}
          retention-days: 14
          overwrite: true
          path: |
            ${{ env.ASVA_RESULTS_DIR }}/fix_batches/*.json
            ${{ env.ASVA_RESULTS_DIR }}/prs.json
            ${{ env.ASVA_RESULTS_DIR }}/fixes.json
            ${{ env.ASVA_RESULTS_DIR }}/stage-status.json
            ${{ env.ASVA_RESULTS_DIR }}/import_maps/*.html

      - name: Save this batch's memory rows for the memory job
        if: always()
        shell: bash
        run: |
          if [ -f memory/asva_memory.db ]; then
            # The store runs in WAL mode -- fold the -wal file into the .db before it is copied.
            python -c "import sqlite3; c = sqlite3.connect('memory/asva_memory.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          fi

      - name: Upload this batch's memory database copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixmem-nodegoat-${{ matrix.batch.batch_id }}
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore
          path: memory/asva_memory.db

  # Combines the fix jobs' results into the one nodegoat-fix-output that pr-check, the rescan, the
  # PR summary and the dashboard read, and lists the PRs for them. No secrets here: AZURE_CREDENTIALS
  # is multi-line JSON, so in a job that uses it GitHub masks a lone "{" and drops the JSON `prs`
  # output ("Skip output 'prs' since it may contain secret").
  candidates:
    name: Combine fix results and publish the candidate list
    needs: [prepare, fix]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest

    outputs:
      prs: ${{ steps.combine.outputs.prs }}

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download findings and fix batches
        uses: actions/download-artifact@v4
        with:
          name: fixprep-nodegoat
          path: prep

      - name: Download each fix job's results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: fixpart-nodegoat-*
          path: parts

      - name: Combine into one fix output and list the PRs
        id: combine
        env:
          NORMALISE_RESULT: ${{ needs.prepare.outputs.normalise }}
          TRIAGE_RESULT: ${{ needs.prepare.outputs.triage }}
        run: python scripts/combine_fix_parts.py --prep prep --parts parts --output fix-output

      - name: Save findings, fix batches, PR list and dashboard fix evidence
        uses: actions/upload-artifact@v4
        with:
          name: nodegoat-fix-output
          retention-days: 14
          overwrite: true
          path: |
            fix-output/findings/*.json
            fix-output/fix_batches/*.json
            fix-output/prs.json
            fix-output/fixes.json
            fix-output/stage-status.json
            fix-output/import_maps/*.html

      # With no container batch there is no container fix job to post the report, and it is posted
      # every run. Without the RAG it leaves out the RAG's notes. Never fails the job.
      - name: Update the container report issue
        if: needs.prepare.outputs.has_container != 'true'
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          python -m gitops.post_container_report \
            --findings fix-output/findings/ranked_unified_findings.json \
            --batch-dir fix-output/fix_batches \
            --prs-json fix-output/prs.json \
            --commit-sha "${{ needs.prepare.outputs.sha }}" \
            --repo-name asva-nodegoat \
            --repo-dir . \
            --execute

      # As before the fix jobs ran in parallel: a run that had batches to fix but opened no PR fails.
      - name: Fail when there were batches to fix and no PR opened
        if: steps.combine.outputs.planned != '0' && steps.combine.outputs.opened == '0'
        run: |
          echo "::error::${{ steps.combine.outputs.planned }} fix batch(es) and no PR opened. See the fix jobs."
          exit 1

  memory:
    name: Save fix history to the memory database
    needs: [prepare, fix]
    if: always() && needs.fix.result != 'skipped'
    runs-on: ubuntu-latest

    env:
      ASVA_AZURE_STORAGE_ACCOUNT: ${{ vars.ASVA_AZURE_STORAGE_ACCOUNT }}
      ASVA_AZURE_STORAGE_CONTAINER: ${{ vars.ASVA_AZURE_STORAGE_CONTAINER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download SQLite memory database
        id: memory_download
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p memory
          # A failed lookup fails this step (and so skips the upload), rather than reading as
          # "no DB yet" and replacing the saved history with this run's alone.
          exists=$(az storage blob exists \
            --account-name "$ASVA_AZURE_STORAGE_ACCOUNT" \
            --container-name "$ASVA_AZURE_STORAGE_CONTAINER" \
            --name asva-memory/asva_memory.db \
            --auth-mode login \
            --query exists -o tsv)
          if [ "$exists" = "true" ]; then
            az storage blob download \
              --account-name "$ASVA_AZURE_STORAGE_ACCOUNT" \
              --container-name "$ASVA_AZURE_STORAGE_CONTAINER" \
              --name asva-memory/asva_memory.db \
              --file memory/asva_memory.db \
              --auth-mode login \
              --overwrite \
              -o none --no-progress
          else
            echo "No existing memory database found; it is created from this run's rows."
          fi

      - name: Download each fix job's memory database copy
        if: steps.memory_download.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: fixmem-nodegoat-*
          path: memory-parts

      - name: Add each fix job's rows from this run
        id: merge
        if: steps.memory_download.outcome == 'success'
        run: |
          python scripts/merge_memory.py --base memory/asva_memory.db --parts memory-parts --run-id "$GITHUB_RUN_ID"

      - name: Upload SQLite memory database
        if: steps.merge.outcome == 'success'
        shell: bash
        run: |
          az storage blob upload \
            --account-name "$ASVA_AZURE_STORAGE_ACCOUNT" \
            --container-name "$ASVA_AZURE_STORAGE_CONTAINER" \
            --name asva-memory/asva_memory.db \
            --file memory/asva_memory.db \
            --auth-mode login \
            --overwrite \
            -o none --no-progress
          echo "Uploaded memory database to $ASVA_AZURE_STORAGE_CONTAINER/asva-memory/asva_memory.db"
