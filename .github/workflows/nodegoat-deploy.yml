name: NodeGoat - Deploy to Kubernetes

on:
  # workflow_dispatch:
  workflow_call:
    inputs:
        deploy_target: # Deployment target (blue|green)
          type: string
          default: 'blue'
          required: false
        deploy_nodeport: # K8s internal cluster port for NodeGoat service
          type: string
          required: false
  push:
    branches:
    #  - rel/26.11
       - /k8s/deploy
    paths:
    #   - 'target-apps/NodeGoat/**'
    #   - '.github/workflows/nodegoat-build.yml' 
      - '.github/workflows/nodegoat-deploy.yml'
      - 'target-apps/NodeGoat/dvng.yaml.template'

# Edit according to deployment target 
env:
  DEPLOY_TARGET: ${{ inputs.deploy_target || 'blue' }} # blue|green
  DEPLOY_NODEPORT: ${{ inputs.deploy_nodeport || vars.NODEPORT_BLUE }} # NODE_PORT_BLUE|GREEN
  
jobs:
  deploy:
    name: Deploy to Kubernetes (${{ inputs.deploy_target || 'blue' }})
    runs-on:
      ${{ vars.ASVA_K8S_RUNNER }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            target-apps/NodeGoat/kubernetes/dvng.yaml.template
          sparse-checkout-cone-mode: true

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
           version: 'latest'

      - name: Apply NodeGoat Kubernetes resources
        run: |
          sed \
          -e "s|\${DEPLOY_TARGET}|$DEPLOY_TARGET|g" \
          -e "s|\${DEPLOY_NODEPORT}|$DEPLOY_NODEPORT|g" \
          target-apps/NodeGoat/kubernetes/dvng.yaml.template > target-apps/NodeGoat/kubernetes/dvng.yaml
          kubectl apply -f target-apps/NodeGoat/kubernetes/dvng.yaml --validate=false
