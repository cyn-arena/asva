# This Workflow is one of 2 ways to build + push to OCI registry for any app in target-apps folder.
# The other way is to call cyn-arena/platform-engine/.github/workflows/build-to-oci-reg.yml@main directly.

name: Generic - Build & Push to OCI Registry

on:
  # workflow_dispatch:
  push:
    branches:
    #  - feat/nodegoat
    #  - rel/26.07
    #  - feat/app-types
       - k8s/deploy

    paths:
    #  - 'target-apps/NodeGoat/Dockerfile'
      - '.github/workflows/any-app-build-oci.yml'
      - 'target-apps/PyGoat/Dockerfile'

  workflow_call:
    inputs:
      app_name:
        type: string
        default: PyGoat
        required: false
      work_dir_parent:
        type: string
        default: target-apps
        required: false
      oci_repo:
        type: string
        default: dvapps
        required: false

env:
  APP_NAME: ${{ inputs.app_name || 'PyGoat' }}
  APP_WORK_DIR: ${{ inputs.work_dir_parent }}/${APP_NAME}
  OCI_REPO: ${{ inputs.oci_repo || 'dvapps' }}

jobs:

## DVNG build and push to OCI registry
#   build-to-oci-dvng:
#     uses: cyn-arena/platform-engine/.github/workflows/build-to-oci-reg.yml@main
#     with:
#       working-directory: target-apps/NodeGoat
#       oci-repo: dvapps
#       tag-prefix: dvng
#     secrets:
#       oci-reg-id: ${{ secrets.OCI_REG_ID }}
#       oci-reg-token: ${{ secrets.OCI_REG_TOKEN }}

  build-to-oci-registry:
    name: Build and Push ${APP_NAME} to OCI registry
    uses: cyn-arena/platform-engine/.github/workflows/build-to-oci-reg.yml@main
    with:
      working-directory: ${APP_WORK_DIR}
      oci-repo: ${OCI_REPO}
      tag-prefix: ${APP_NAME}
    secrets:
      oci-reg-id: ${{ secrets.OCI_REG_ID }}
      oci-reg-token: ${{ secrets.OCI_REG_TOKEN }}

