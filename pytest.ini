[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers
xfail_strict = true

markers =
    unit: pure/offline unit tests (no network, no token, no gitleaks binary)
    api: request-level checks against a running NodeGoat target (BASE_URL)
    browser: Playwright DOM/session checks against a running NodeGoat target (BASE_URL)
    rescan: before/after Snyk SARIF diff (needs SNYK_TOKEN, SNYK_ORG)
    smoke: pre-merge happy-path suite against green (BASE_URL=dvng2)
