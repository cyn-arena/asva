# PyGoat is intentionally vulnerable. Deploy it only to an isolated cluster.

name: PyGoat - Deploy to Kubernetes

on:
  # workflow_dispatch:
  workflow_call:
  push:
    branches:
    #  - rel/26.11
       - k8s/deploy
    paths:
      - '.github/workflows/pygoat-deploy.yml'
      - 'target-apps/PyGoat/kubernetes/pygoat.yaml'

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on:
      ${{ vars.ASVA_K8S_RUNNER }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            target-apps/PyGoat/kubernetes
          sparse-checkout-cone-mode: true

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
           version: 'latest'

      - name: Apply PyGoat Kubernetes resources
        run: kubectl apply -f target-apps/PyGoat/kubernetes/pygoat.yaml --validate=false
