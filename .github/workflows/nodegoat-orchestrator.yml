name: NodeGoat - Pipeline

on:
  push:
    branches:
      - 'feat/**'
    paths:
      - 'target-apps/NodeGoat/**'
      - '.github/workflows/nodegoat-*.yml'
      - '.github/workflows/publish-dashboard-results.yml'
      - 'scripts/dashboard_evidence.py'
      - 'scripts/candidate_rescan.py'
      - '.github/workflows/candidate-rescan.yml'
      - 'normaliser/**'
      - 'triage/**'
      - 'agent/candidate_source.py'
  workflow_dispatch:
    inputs:
      scan_kind:
        description: Initial scan, or a new scan after reviewed fixes were applied
        type: choice
        options: [initial, after_fix]
        default: initial
      after_fix_of:
        description: Original Actions run ID (required only for an after-fix run)
        type: string
        default: ''
      run_build_deploy:
        description: >-
          Build and publish this branch's application image, deploy to shared green,
          and test the deployed application. Build starts after fix generation,
          alongside candidate validation; fix PRs are not merged by this option.
          Available only for manual runs. Uncheck to skip build, deployment and E2E tests.
        type: boolean
        default: false # Set to true when deployment is safe
      # ---- TEST BRANCH ONLY (component comparison) ----
      arm:
        description: Which ITP2 parts are on (official = all on, shared memory, as on rel)
        type: choice
        options: [official, baseline, memory, memory-shared, repo, rag, testfirst, testfirst-rag, full]
        default: official
      scan_run_id:
        description: Reuse the scan from this run ID instead of scanning again (blank = scan now)
        type: string
        default: ''
      run_label:
        description: Added to fix branch names, e.g. cc-baseline-r1 (letters, digits, - and _)
        type: string
        default: ''
      lockfile_rescan_prs:
        description: 'Only rescan these dependency PRs with a rebuilt lock file: JSON list of {batch_id, sha, pr_url} (blank = normal run)'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: read        # must cover nodegoat-fix.yml's own actions:read grant
  issues: write        # must cover nodegoat-fix.yml's own issues:write grant
  packages: read       # must cover nodegoat-fix.yml's own packages:read grant (RAG image)

jobs:
  scan:
    name: NodeGoat - Scan vulnerabilities
    if: ${{ !inputs.scan_run_id && !inputs.lockfile_rescan_prs }} # TEST BRANCH ONLY: skipped when reusing a scan or only rescanning
    uses: ./.github/workflows/nodegoat-scan.yml
    secrets: inherit

  # TEST BRANCH ONLY (component comparison): rescan dependency PRs whose lock file is out of
  # sync with package.json, after rebuilding it. Nothing is pushed; every other job is skipped.
  lockfile-rescan:
    name: NodeGoat - Rescan with a rebuilt lock file (comparison only)
    if: ${{ inputs.lockfile_rescan_prs != '' }}
    uses: ./.github/workflows/candidate-rescan.yml
    with:
      app-code: nodegoat
      app-path: target-apps/NodeGoat
      ecosystem: npm
      manifest: package.json
      container-file: docker-compose.yml
      container-mode: third-party
      node-version: '20.19.0'
      npm-version: '8.19.4'
      compose-files: docker-compose.yml docker-compose.pr-check.yml
      prs: ${{ inputs.lockfile_rescan_prs }}
      regenerate-lockfile: true
    secrets: inherit

  test-unit:
    name: NodeGoat - Test ASVA components
    if: ${{ !inputs.lockfile_rescan_prs }} # TEST BRANCH ONLY: skipped when only rescanning
    uses: ./.github/workflows/nodegoat-test.yml
    with:
      stage: unit

  fix:
    name: NodeGoat - Normalise, triage and generate candidates
    needs: [scan, test-unit]
    if: ${{ !cancelled() && inputs.scan_kind != 'after_fix' && needs.test-unit.result == 'success' && (needs.scan.result == 'success' || (needs.scan.result == 'skipped' && inputs.scan_run_id != '')) }}
    uses: ./.github/workflows/nodegoat-fix.yml
    with:
      use_artifacts: ${{ !inputs.scan_run_id }}
      scan_run_id: ${{ inputs.scan_run_id || '' }}
      source_branch: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}
      # TEST BRANCH ONLY: what each comparison arm switches on (no arm = official)
      arm_test_first: ${{ contains(fromJSON('["official","testfirst","testfirst-rag","full"]'), (inputs.arm || 'official')) && '1' || '0' }}
      arm_repo_context: ${{ contains(fromJSON('["official","repo","full"]'), (inputs.arm || 'official')) && '1' || '0' }}
      arm_rag: ${{ contains(fromJSON('["official","rag","testfirst-rag","full"]'), (inputs.arm || 'official')) }}
      arm_memory: ${{ (inputs.arm || 'official') == 'official' && 'real' || inputs.arm == 'baseline' && 'fresh' || contains(fromJSON('["full","memory-shared"]'), inputs.arm) && 'readonly' || inputs.arm == 'memory' && 'reuse' || 'off' }}
      arm_report_issues: ${{ (inputs.arm || 'official') == 'official' }}
      branch_suffix: ${{ inputs.run_label || '' }}
      arm_sca_mode: ${{ contains(fromJSON('["baseline","memory","memory-shared","repo","rag"]'), inputs.arm) && 'llm' || '' }}
      ## ---------- specify scan run id to fix specified scan ---------- 
      # scan_run_id: "29006193665" 
    secrets: inherit

  pr-check:
    name: NodeGoat - Validate fix candidates
    needs: fix
    if: always() && needs.fix.outputs.prs != '' && needs.fix.outputs.prs != '[]'
    uses: ./.github/workflows/nodegoat-pr-check.yml
    with:
      prs: ${{ needs.fix.outputs.prs }}
    secrets: inherit

  # Deployment is owned by ST and stays off (run_build_deploy defaults to false) until ST enables it.
  build:
    name: NodeGoat - Build and publish image
    needs: fix
    if: success() && github.event_name == 'workflow_dispatch' && inputs.run_build_deploy != false
    # Shared build. If it misbehaves, switch back to ./.github/workflows/nodegoat-build.yml
    # (no inputs needed).
    uses: ./.github/workflows/any-app-build-oci.yml
    with:
      app_name: NodeGoat
      tag_prefix: dvng # dvng.yaml.template pulls dvng-latest
    secrets: inherit

  deploy:
    name: NodeGoat - Deploy to Kubernetes (green)
    needs: build
    if: success() && github.event_name == 'workflow_dispatch' && inputs.run_build_deploy != false
    uses: ./.github/workflows/nodegoat-deploy.yml
    with:
      deploy_target: green
      deploy_nodeport: ${{ vars.NODEPORT_GREEN }}
      image_sha: ${{ github.sha }} # the build above tagged this run's image dvng-<short sha>

  test-e2e:
    name: NodeGoat - Test deployed application
    needs: deploy
    if: success() && github.event_name == 'workflow_dispatch' && inputs.run_build_deploy != false
    uses: ./.github/workflows/nodegoat-test.yml
    with:
      stage: e2e
      base_url: ${{ vars.NODEGOAT_BASE_URL }}
      run_misuse: false  # flip on once fix PRs are merged onto this branch and redeployed


  after-fix:
    name: NodeGoat - Scan each independent candidate
    needs: fix
    if: always() && needs.fix.outputs.prs != '' && needs.fix.outputs.prs != '[]'
    uses: ./.github/workflows/candidate-rescan.yml
    with:
      app-code: nodegoat
      app-path: target-apps/NodeGoat
      ecosystem: npm
      manifest: package.json
      container-file: docker-compose.yml
      container-mode: third-party
      node-version: '20.19.0'
      npm-version: '8.19.4'
      compose-files: docker-compose.yml docker-compose.pr-check.yml
      prs: ${{ needs.fix.outputs.prs }}
    secrets: inherit

  pr-summary:
    name: NodeGoat - Compare options on each PR
    needs: [fix, pr-check, after-fix]
    if: always() && needs.fix.outputs.prs != '' && needs.fix.outputs.prs != '[]'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/pr-summary.yml
    with:
      app-code: nodegoat
    secrets: inherit

  publish:
    name: NodeGoat - Publish dashboard evidence
    needs: [scan, test-unit, fix, pr-check, build, deploy, test-e2e, after-fix]
    if: ${{ false }} # TEST BRANCH ONLY: comparison runs are not published to the dashboard
    uses: ./.github/workflows/publish-dashboard-results.yml
    with:
      app-code: nodegoat
      scan-kind: ${{ inputs.scan_kind || 'initial' }}
      after-fix-of: ${{ inputs.after_fix_of || '' }}
      legacy-uploads: true
      outcomes: >-
        {"scan":"${{ needs.scan.result }}","unit_tests":"${{ needs.test-unit.result }}","fix":"${{ needs.fix.result }}","validate":"${{ needs.pr-check.result }}","after_fix":"${{ needs.after-fix.result }}"}
    secrets: inherit
