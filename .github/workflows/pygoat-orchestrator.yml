# Pipeline through candidate validation, followed by final Azure evidence publishing.
name: PyGoat - Pipeline

on:
  push:
    branches:
      - 'feat/**'
    paths:
      - 'target-apps/PyGoat/**'
      - '.github/workflows/pygoat-*.yml'
      - 'scripts/pygoat-smoke.py'
      - '.github/workflows/publish-dashboard-results.yml'
      - 'scripts/dashboard_evidence.py'
      - 'scripts/candidate_rescan.py'
      - '.github/workflows/candidate-rescan.yml'
      - 'normaliser/**'
      - 'triage/**'
      - 'agent/candidate_source.py'
  workflow_dispatch:
    inputs:
      scan_kind:
        description: Initial scan, or a new scan after reviewed fixes were applied
        type: choice
        options: [initial, after_fix]
        default: initial
      after_fix_of:
        description: Original Actions run ID (required only for an after-fix run)
        type: string
        default: ''
      run_build_deploy:
        description: >-
          Build and publish this branch's application image, then deploy it to Kubernetes.
          Build starts after fix generation, alongside candidate validation; fix PRs are
          not merged by this option. Available only for manual runs.
        type: boolean
        default: false # Set to true when deployment is safe
      # ---- TEST BRANCH ONLY (component comparison) ----
      arm:
        description: Which ITP2 parts are on (official = all on, shared memory, as on rel)
        type: choice
        options: [official, baseline, memory, repo, rag, testfirst, testfirst-rag, full]
        default: official
      scan_run_id:
        description: Reuse the scan from this run ID instead of scanning again (blank = scan now)
        type: string
        default: ''
      run_label:
        description: Added to fix branch names, e.g. cc-baseline-r1 (letters, digits, - and _)
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write
  packages: read   # must cover pygoat-fix.yml's own packages:read grant (RAG image)

jobs:
  baseline:
    name: PyGoat - Validate original application
    uses: ./.github/workflows/pygoat-baseline.yml

  scan:
    name: PyGoat - Scan vulnerabilities
    if: ${{ !inputs.scan_run_id }} # TEST BRANCH ONLY: skipped when reusing a scan
    needs: baseline
    uses: ./.github/workflows/pygoat-scan.yml
    secrets: inherit

  test-unit:
    name: PyGoat - Test ASVA components
    needs: baseline
    uses: ./.github/workflows/pygoat-test.yml
    with:
      stage: unit

  fix:
    name: PyGoat - Normalise, triage and generate fixes
    needs: [scan, test-unit]
    if: ${{ !cancelled() && inputs.scan_kind != 'after_fix' && needs.test-unit.result == 'success' && (needs.scan.result == 'success' || (needs.scan.result == 'skipped' && inputs.scan_run_id != '')) }}
    uses: ./.github/workflows/pygoat-fix.yml
    with:
      use_artifacts: ${{ !inputs.scan_run_id }}
      scan_run_id: ${{ inputs.scan_run_id || '' }}
      source_branch: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}
      # TEST BRANCH ONLY: what each comparison arm switches on (no arm = official)
      arm_test_first: ${{ contains(fromJSON('["official","testfirst","testfirst-rag","full"]'), (inputs.arm || 'official')) && '1' || '0' }}
      arm_repo_context: ${{ contains(fromJSON('["official","repo","full"]'), (inputs.arm || 'official')) && '1' || '0' }}
      arm_rag: ${{ contains(fromJSON('["official","rag","testfirst-rag","full"]'), (inputs.arm || 'official')) }}
      arm_memory: ${{ (inputs.arm || 'official') == 'official' && 'real' || inputs.arm == 'baseline' && 'fresh' || contains(fromJSON('["memory","full"]'), inputs.arm) && 'reuse' || 'off' }}
      arm_report_issues: ${{ (inputs.arm || 'official') == 'official' }}
      branch_suffix: ${{ inputs.run_label || '' }}
      arm_base_image: ${{ contains(fromJSON('["official","testfirst","testfirst-rag","full"]'), (inputs.arm || 'official')) && '1' || '0' }}
    secrets: inherit

  pr-check:
    name: PyGoat - Validate fix candidates
    needs: fix
    if: always() && needs.fix.outputs.prs != '' && needs.fix.outputs.prs != '[]'
    uses: ./.github/workflows/pygoat-pr-check.yml
    with:
      prs: ${{ needs.fix.outputs.prs }}
    secrets: inherit

  # Deployment is owned by ST and stays off (run_build_deploy defaults to false).
  # The image is built from this branch's target-apps/PyGoat/Dockerfile, the same file the scan
  # and candidate checks use. It is not built from a fix candidate.
  build:
    name: PyGoat - Build and publish image
    needs: fix
    if: success() && github.event_name == 'workflow_dispatch' && inputs.run_build_deploy != false
    uses: ./.github/workflows/any-app-build-oci.yml
    with:
      app_name: PyGoat # pushes PyGoat-<short sha> and PyGoat-latest
    secrets: inherit

  deploy:
    name: PyGoat - Deploy to Kubernetes
    needs: build
    if: success() && github.event_name == 'workflow_dispatch' && inputs.run_build_deploy != false
    uses: ./.github/workflows/pygoat-deploy.yml
    with:
      image_sha: ${{ github.sha }} # the build above tagged this run's image PyGoat-<short sha>

  test-e2e:
    name: PyGoat - Test deployed application
    needs: deploy
    if: success() && github.event_name == 'workflow_dispatch' && inputs.run_build_deploy != false
    uses: ./.github/workflows/pygoat-test.yml
    with:
      stage: e2e
      base_url: ${{ vars.PYGOAT_BASE_URL }}

  after-fix:
    name: PyGoat - Scan each independent candidate
    needs: fix
    if: always() && needs.fix.outputs.prs != '' && needs.fix.outputs.prs != '[]'
    uses: ./.github/workflows/candidate-rescan.yml
    with:
      app-code: pygoat
      app-path: target-apps/PyGoat
      ecosystem: pip
      manifest: requirements.txt
      container-file: Dockerfile
      container-mode: application
      python-image: python:3.11-slim-bookworm
      pip-version: 22.0.4
      system-packages: build-essential dnsutils libpq-dev
      prs: ${{ needs.fix.outputs.prs }}
    secrets: inherit

  pr-summary:
    name: PyGoat - Compare options on each PR
    needs: [fix, pr-check, after-fix]
    if: always() && needs.fix.outputs.prs != '' && needs.fix.outputs.prs != '[]'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/pr-summary.yml
    with:
      app-code: pygoat
    secrets: inherit

  publish:
    name: PyGoat - Publish dashboard evidence
    # Waits for build, deploy and test-e2e too, so evidence is published last. Their results are not
    # in outcomes yet: that is an additive change to the dashboard contract.
    needs: [baseline, scan, test-unit, fix, pr-check, after-fix, build, deploy, test-e2e]
    if: ${{ false }} # TEST BRANCH ONLY: comparison runs are not published to the dashboard
    uses: ./.github/workflows/publish-dashboard-results.yml
    with:
      app-code: pygoat
      scan-kind: ${{ inputs.scan_kind || 'initial' }}
      after-fix-of: ${{ inputs.after_fix_of || '' }}
      outcomes: >-
        {"baseline":"${{ needs.baseline.result }}","scan":"${{ needs.scan.result }}","unit_tests":"${{ needs.test-unit.result }}","fix":"${{ needs.fix.result }}","validate":"${{ needs.pr-check.result }}","after_fix":"${{ needs.after-fix.result }}"}
    secrets: inherit
