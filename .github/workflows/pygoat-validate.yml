name: PyGoat - Build and Validate

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'target-apps/PyGoat/**'
      - 'scripts/pygoat-smoke.py'
      - '.github/workflows/pygoat-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    # PRs the pipeline opens with GITHUB_TOKEN are tested by the pipeline's own candidate check.
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build, migrate and wait for readiness
        working-directory: target-apps/PyGoat
        run: docker compose -f compose.asva.yml up -d --build --wait --wait-timeout 120
      - name: Functional smoke checks
        if: always()
        run: python scripts/pygoat-smoke.py
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p asva-results
          docker compose -f target-apps/PyGoat/compose.asva.yml logs --no-color > asva-results/pygoat.log 2>&1
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pygoat-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: asva-results/
          retention-days: 14
      - name: Teardown disposable CI database
        if: always()
        working-directory: target-apps/PyGoat
        run: docker compose -f compose.asva.yml down -v
